<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气视窗 · Weather Vision</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 动态背景层 -->
    <div class="background-layer">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="grain"></div>
    </div>

    <!-- 天气动画元素层 -->
    <div class="weather-animations" id="weatherAnimations"></div>

    <!-- 主容器 -->
    <main class="app-container" id="appContainer">
        
        <!-- 顶部搜索栏 -->
        <header class="search-header">
            <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" id="cityInput" placeholder="搜索城市，如 上海 · Tokyo · Paris" autocomplete="off">
                <button id="locationBtn" class="location-btn" title="使用当前位置">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path>
                    </svg>
                </button>
            </div>
            <button class="unit-toggle" id="unitToggle">°C</button>
        </header>

        <!-- 主天气卡片 -->
        <section class="hero-card">
            <div class="hero-content">
                <div class="hero-left">
                    <div class="location">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 22s-8-7.58-8-13a8 8 0 1 1 16 0c0 5.42-8 13-8 13z"></path>
                            <circle cx="12" cy="9" r="3"></circle>
                        </svg>
                        <h1 id="cityName">加载中...</h1>
                    </div>
                    <p class="current-date" id="currentDate">--</p>
                    
                    <div class="temp-display">
                        <span class="temp-value" id="tempValue">--</span>
                        <span class="temp-unit" id="tempUnit">°C</span>
                    </div>
                    
                    <p class="weather-desc" id="weatherDesc">--</p>
                    
                    <div class="hilo-row">
                        <span class="hi-lo">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2v20M6 14l6 6 6-6"></path>
                            </svg>
                            <span id="tempMin">--°</span>
                        </span>
                        <span class="hi-lo">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 22V2M6 10l6-6 6 6"></path>
                            </svg>
                            <span id="tempMax">--°</span>
                        </span>
                        <span class="feels-like">体感 <span id="feelsLike">--°</span></span>
                    </div>
                </div>

                <div class="hero-right">
                    <div class="weather-icon-large" id="weatherIcon">
                        <!-- 动态 SVG 图标 -->
                    </div>
                </div>
            </div>
        </section>

        <!-- 详细数据网格 -->
        <section class="details-grid">
            
            <!-- 日出日落 -->
            <div class="detail-card sunrise-sunset">
                <h3>日出 · 日落</h3>
                <div class="sunrise-sunset-content">
                    <div class="sun-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="14" r="4"></circle>
                            <path d="M12 10V2M5 14H2M19 14h3M4 8l2 2M18 8l-2 2M6 20l2-2M16 18l2 2"></path>
                        </svg>
                        <span class="label">日出</span>
                        <span class="value" id="sunrise">--:--</span>
                    </div>
                    <div class="sun-arc">
                        <svg viewBox="0 0 200 60" preserveAspectRatio="none">
                            <path d="M10 50 Q100 -20 190 50" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>
                            <circle cx="100" cy="10" r="5" fill="currentColor" id="sunPosition"/>
                        </svg>
                    </div>
                    <div class="sun-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="10" r="4"></circle>
                            <path d="M12 14v8M5 10H2M19 10h3M4 16l2-2M18 16l-2-2M6 4l2 2M16 2l2 2"></path>
                        </svg>
                        <span class="label">日落</span>
                        <span class="value" id="sunset">--:--</span>
                    </div>
                </div>
            </div>

            <!-- 空气质量/湿度 -->
            <div class="detail-card humidity-card">
                <h3>湿度</h3>
                <div class="humidity-display">
                    <svg class="humidity-svg" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="8" opacity="0.2"/>
                        <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="8" 
                                stroke-linecap="round" id="humidityCircle"
                                stroke-dasharray="251.2" stroke-dashoffset="251.2" 
                                transform="rotate(-90 50 50)"/>
                    </svg>
                    <div class="humidity-text">
                        <span class="humidity-value" id="humidity">--%</span>
                        <span class="humidity-label" id="humidityDesc">--</span>
                    </div>
                </div>
            </div>

            <!-- 风速 -->
            <div class="detail-card wind-card">
                <h3>风速</h3>
                <div class="wind-content">
                    <div class="wind-compass">
                        <svg viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3"/>
                            <text x="50" y="15" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.7">N</text>
                            <text x="50" y="92" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.7">S</text>
                            <text x="10" y="54" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.7">W</text>
                            <text x="90" y="54" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.7">E</text>
                            <g id="windArrow" transform="rotate(0 50 50)">
                                <path d="M50 15 L55 50 L50 45 L45 50 Z" fill="currentColor"/>
                            </g>
                        </svg>
                    </div>
                    <div class="wind-info">
                        <span class="wind-speed" id="windSpeed">-- km/h</span>
                        <span class="wind-direction" id="windDirection">--</span>
                    </div>
                </div>
            </div>

            <!-- 气压 -->
            <div class="detail-card pressure-card">
                <h3>气压</h3>
                <div class="pressure-content">
                    <svg class="pressure-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 12l4-4"/>
                        <path d="M12 7v5l3 3"/>
                    </svg>
                    <span class="pressure-value" id="pressure">-- hPa</span>
                </div>
                <p class="pressure-trend" id="pressureTrend">--</p>
            </div>

            <!-- 能见度 -->
            <div class="detail-card visibility-card">
                <h3>能见度</h3>
                <div class="visibility-content">
                    <span class="visibility-value" id="visibility">-- km</span>
                </div>
                <div class="visibility-bar">
                    <div class="visibility-bar-bg"></div>
                    <div class="visibility-bar-fill" id="visibilityBar"></div>
                </div>
                <p class="visibility-desc" id="visibilityDesc">--</p>
            </div>

            <!-- 紫外线 -->
            <div class="detail-card uv-card">
                <h3>紫外线指数</h3>
                <div class="uv-value" id="uvValue">--</div>
                <div class="uv-bar">
                    <div class="uv-segments">
                        <div></div><div></div><div></div><div></div><div></div>
                    </div>
                </div>
                <p class="uv-desc" id="uvDesc">--</p>
            </div>

        </section>

        <!-- 小时预报 -->
        <section class="hourly-section">
            <div class="section-header">
                <h2>24 小时趋势</h2>
                <div class="temp-chart-container">
                    <svg id="tempChart" class="temp-chart" viewBox="0 0 800 120" preserveAspectRatio="none">
                        <!-- 动态绘制温度曲线 -->
                    </svg>
                </div>
            </div>
            <div class="hourly-scroll" id="hourlyScroll">
                <!-- 动态生成 -->
            </div>
        </section>

        <!-- 7天预报 -->
        <section class="forecast-section">
            <div class="section-header">
                <h2>7 天预报</h2>
            </div>
            <div class="forecast-list" id="forecastList">
                <!-- 动态生成 -->
            </div>
        </section>

        <!-- 页脚 -->
        <footer class="app-footer">
            <p>数据来源 · Open-Meteo API</p>
            <p class="footer-sub">Powered by Weather Vision · 纯会话实现</p>
        </footer>

    </main>

    <!-- 加载状态 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader">
            <svg viewBox="0 0 50 50">
                <circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="3" opacity="0.2"/>
                <circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="3"
                        stroke-linecap="round" stroke-dasharray="125.6" stroke-dashoffset="125.6">
                    <animate attributeName="stroke-dashoffset" values="125.6;0" dur="1.5s" repeatCount="indefinite"/>
                    <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1.5s" repeatCount="indefinite"/>
                </circle>
            </svg>
            <p>正在获取天气数据...</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
